name: Dragonflight UI v2.5 Theme Foundation
on:
  pull_request:
  push:
    branches:
      - feature/theme-foundation-m1
jobs:
  lua-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: |
          luac5.1 -p core/core.lua
          luac5.1 -p core/theme.lua
          luac5.1 -p core/first.lua
      - name: Theme regression tests
        run: lua5.1 tests/theme_foundation.lua
