name: Dragonflight UI v2.5 Edit Mode and Keybinding Safety
on:
  pull_request:
  push:
    branches:
      - fix/editmode-keybind-confirm
jobs:
  lua-edit-keybind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: |
          luac5.1 -p modules/frames/frames.lua modules/menu/editmode.lua modules/bars/hoverbind.lua
      - name: Earlier regression suites
        run: |
          lua5.1 tests/theme_foundation.lua
          lua5.1 tests/theme_selection.lua
          lua5.1 tests/theme_action_skins.lua
          lua5.1 tests/theme_unit_skins.lua
      - name: Transactional mouseover keybindings
        run: lua5.1 tests/editmode_keybind.lua
      - name: Edit Mode preview frames
        run: lua5.1 tests/editmode_preview.lua
