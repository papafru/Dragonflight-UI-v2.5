name: Dragonflight UI v2.5 Modern Action Skins
on:
  push:
    branches:
      - feature/theme-skins-m3
  pull_request:
jobs:
  lua-skins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax validation
        run: |
          luac5.1 -p modules/bars/skins.lua modules/bars/bars.lua core/theme.lua
          lua5.1 tests/syntax_check.lua
      - name: Prior foundation regression
        run: lua5.1 tests/theme_foundation.lua
      - name: Prior theme selection regression
        run: lua5.1 tests/theme_selection.lua
      - name: Action skin regression
        run: lua5.1 tests/theme_action_skins.lua
